name: Release Tauri

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build (e.g. v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to rebuild (e.g. v0.1.0)
        required: true
        type: string

permissions:
  contents: write

# One queue for workflow_call (CI) and workflow_dispatch (manual rebuild).
# There is no release: published trigger: semantic-release already publishes
# the GitHub Release, and CI calls this workflow with that tag. A release
# event would start a second build of the same tag.
#
# The group stays a fixed name. On workflow_call, github.workflow is the
# caller ("CI") and github.ref is the branch, so ${{ github.workflow }}-${{ github.ref }}
# or release-${{ github.ref }} matches a group ci.yml still holds. GitHub then
# cancels the run as a deadlock. One group across tags also keeps an older
# build from uploading at the same time as a newer one.
concurrency:
  group: release-tauri
  cancel-in-progress: false

jobs:
  sniffer-linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          repository: springfield-ham-radio/ham-radio-sniffer
          path: ham-radio-sniffer

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config

      - name: Build sniffer
        working-directory: ham-radio-sniffer
        run: cargo build --release

      - name: Stage the ARM64 binary
        run: |
          mkdir -p dist
          cp ham-radio-sniffer/target/release/ham-radio-sniffer dist/ham-radio-sniffer-linux-aarch64

      - uses: actions/upload-artifact@v7
        with:
          name: ham-radio-sniffer-linux-aarch64
          path: dist/ham-radio-sniffer-linux-aarch64

  publish-tauri:
    needs: sniffer-linux-arm64
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          # 64-bit Raspberry Pi. Same Ubuntu release as x64 so glibc stays compatible with Pi OS Bookworm.
          - platform: ubuntu-22.04-arm
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          repository: springfield-ham-radio/ham-radio-sniffer
          path: vendor/ham-radio-sniffer

      - uses: actions/download-artifact@v8
        with:
          name: ham-radio-sniffer-linux-aarch64
          path: vendor/ham-radio-sniffer/dist

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils provides /usr/bin/xdg-open. The x64 image includes it; the ARM image does not, and the AppImage bundler stops without it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev xdg-utils

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node 26 does not ship Corepack. windows-latest also has Yarn 1.22
      # ahead of the Node 22 Corepack shims: PowerShell picks yarn.ps1 and
      # Git bash picks the extensionless yarn script. Wrappers at the front
      # of PATH make every later step, including Tauri's beforeBuildCommand,
      # call `corepack yarn` (the version in packageManager).
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            shim_dir="$(cygpath -u "$RUNNER_TEMP")/corepack-bin"
            mkdir -p "$shim_dir"
            printf '%s\n' '#!/bin/sh' 'exec corepack yarn "$@"' > "$shim_dir/yarn"
            printf '%s\n' '#!/bin/sh' 'exec corepack yarnpkg "$@"' > "$shim_dir/yarnpkg"
            printf '%s\r\n' '@echo off' 'corepack yarn %*' > "$shim_dir/yarn.cmd"
            printf '%s\r\n' '@echo off' 'corepack yarnpkg %*' > "$shim_dir/yarnpkg.cmd"
            printf '%s\n' 'corepack yarn @args' > "$shim_dir/yarn.ps1"
            printf '%s\n' 'corepack yarnpkg @args' > "$shim_dir/yarnpkg.ps1"
            chmod +x "$shim_dir/yarn" "$shim_dir/yarnpkg"
            export PATH="$shim_dir:$PATH"
            cygpath -w "$shim_dir" >> "$GITHUB_PATH"
          else
            corepack enable
          fi
          hash -r
          echo "yarn $(yarn --version) ($(command -v yarn))"
          yarn install --immutable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare updater signing
        id: updater_signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-updater-signing.ts

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater_signing.outputs.private_key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater_signing.outputs.private_key_password }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: HamBench ${{ inputs.tag }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag, '-') }}
          args: ${{ matrix.args }}

  rename-downloads:
    needs: publish-tauri
    if: always() && (needs.publish-tauri.result == 'success' || needs.publish-tauri.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Rename installer downloads
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/rename-release-installers.ts

      # tauri-action updates the release without make_latest, and the API
      # default marks that release as latest. Point releases/latest at the
      # highest stable version so an older build cannot leave
      # releases/latest/download/latest.json on the older tag.
      - name: Point releases/latest at the newest stable release
        if: always() && steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/mark-latest-stable-release.ts
