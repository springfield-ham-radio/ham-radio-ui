name: Release Tauri

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build (e.g. v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to rebuild (e.g. v0.1.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-tauri-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node 26 does not ship Corepack. windows-latest also has Yarn 1.22
      # ahead of the Node 22 Corepack shims: PowerShell picks yarn.ps1 and
      # Git bash picks the extensionless yarn script. Wrappers at the front
      # of PATH make every later step, including Tauri's beforeBuildCommand,
      # call `corepack yarn` (the version in packageManager).
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            shim_dir="$(cygpath -u "$RUNNER_TEMP")/corepack-bin"
            mkdir -p "$shim_dir"
            printf '%s\n' '#!/bin/sh' 'exec corepack yarn "$@"' > "$shim_dir/yarn"
            printf '%s\n' '#!/bin/sh' 'exec corepack yarnpkg "$@"' > "$shim_dir/yarnpkg"
            printf '%s\r\n' '@echo off' 'corepack yarn %*' > "$shim_dir/yarn.cmd"
            printf '%s\r\n' '@echo off' 'corepack yarnpkg %*' > "$shim_dir/yarnpkg.cmd"
            printf '%s\n' 'corepack yarn @args' > "$shim_dir/yarn.ps1"
            printf '%s\n' 'corepack yarnpkg @args' > "$shim_dir/yarnpkg.ps1"
            chmod +x "$shim_dir/yarn" "$shim_dir/yarnpkg"
            export PATH="$shim_dir:$PATH"
            cygpath -w "$shim_dir" >> "$GITHUB_PATH"
          else
            corepack enable
          fi
          hash -r
          echo "yarn $(yarn --version) ($(command -v yarn))"
          yarn install --immutable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare updater signing
        id: updater_signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: node scripts/prepare-updater-signing.ts

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater_signing.outputs.private_key }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater_signing.outputs.private_key_password }}
        with:
          tagName: ${{ inputs.tag || github.event.release.tag_name }}
          releaseName: HamBench ${{ inputs.tag || github.event.release.tag_name }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag || github.event.release.tag_name, '-') }}
          args: ${{ matrix.args }}

  rename-downloads:
    needs: publish-tauri
    if: always() && (needs.publish-tauri.result == 'success' || needs.publish-tauri.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Rename installer downloads
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: node scripts/rename-release-installers.ts
