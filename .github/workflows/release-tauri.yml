name: Release Tauri

on:
  workflow_call:
    inputs:
      tag:
        description: Git tag to build (e.g. v0.1.0)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to rebuild (e.g. v0.1.0)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-tauri-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: true

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: corepack enable
      - run: yarn install --immutable

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Prepare updater signing
        id: updater_signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tsx scripts/prepare-updater-signing.ts

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.updater_signing.outputs.private_key_path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ steps.updater_signing.outputs.private_key_password }}
        with:
          tagName: ${{ inputs.tag || github.event.release.tag_name }}
          releaseName: HamBench ${{ inputs.tag || github.event.release.tag_name }}
          releaseBody: See the assets to download this version and install.
          releaseDraft: false
          prerelease: ${{ contains(inputs.tag || github.event.release.tag_name, '-') }}
          args: ${{ matrix.args }}
