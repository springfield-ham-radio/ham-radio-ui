name: CI

on:
  push:
    branches: [main, beta]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull requests cancel. A push to main or beta runs to completion
  # so semantic-release and the installer build are not dropped mid-release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Official Node.js 26 binaries do not ship Corepack. 0.36.0 is the
      # Corepack release the Node.js 26 line last tracked.
      - run: npm install -g corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn build
      - run: yarn lint
      - run: yarn test:unit

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev pkg-config build-essential libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Test Rust
        working-directory: src-tauri
        run: cargo test --locked

  rust-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Check Rust
        working-directory: src-tauri
        run: cargo check --locked
      - name: Test vendored serial crates
        working-directory: src-tauri
        run: |
          cargo test --locked -p serialport
          cargo test --locked -p serialplugin-core --lib

  # Release Tauri does not run on pull requests. This job runs the same
  # Windows Corepack install as publish-tauri so the hosted image's Yarn
  # shims cannot regress unnoticed. Lifecycle scripts stay off; the Ubuntu
  # build job already runs prepare.
  windows-js:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        shell: bash
        env:
          YARN_ENABLE_SCRIPTS: "false"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm uninstall -g yarn || true
            npm uninstall -g pnpm || true
            prefix="$(cygpath -u "$(npm prefix -g | tr -d '\r')")"
            rm -f \
              "$prefix/yarn" "$prefix/yarn.cmd" "$prefix/yarn.ps1" \
              "$prefix/yarnpkg" "$prefix/yarnpkg.cmd" "$prefix/yarnpkg.ps1" \
              "$prefix/pnpm" "$prefix/pnpm.cmd" "$prefix/pnpm.ps1" \
              "$prefix/pnpx" "$prefix/pnpx.cmd" "$prefix/pnpx.ps1"
            npm install -g --force corepack@0.36.0
          else
            npm install -g corepack@0.36.0
          fi
          if [ "$RUNNER_OS" = "Windows" ]; then
            shim_dir="$(cygpath -u "$RUNNER_TEMP")/corepack-bin"
            mkdir -p "$shim_dir"
            printf '%s\n' '#!/bin/sh' 'exec corepack yarn "$@"' > "$shim_dir/yarn"
            printf '%s\n' '#!/bin/sh' 'exec corepack yarnpkg "$@"' > "$shim_dir/yarnpkg"
            printf '%s\r\n' '@echo off' 'corepack yarn %*' > "$shim_dir/yarn.cmd"
            printf '%s\r\n' '@echo off' 'corepack yarnpkg %*' > "$shim_dir/yarnpkg.cmd"
            printf '%s\n' 'corepack yarn @args' > "$shim_dir/yarn.ps1"
            printf '%s\n' 'corepack yarnpkg @args' > "$shim_dir/yarnpkg.ps1"
            chmod +x "$shim_dir/yarn" "$shim_dir/yarnpkg"
            export PATH="$shim_dir:$PATH"
            cygpath -w "$shim_dir" >> "$GITHUB_PATH"
          else
            corepack enable
          fi
          hash -r
          corepack_version="$(corepack --version | tr -d '\r' | tail -n 1)"
          yarn_version="$(yarn --version | tr -d '\r' | tail -n 1)"
          echo "corepack ${corepack_version} ($(command -v corepack))"
          echo "yarn ${yarn_version} ($(command -v yarn))"
          test "$corepack_version" = "0.36.0"
          test "$yarn_version" = "4.18.0"
          yarn install --immutable

  release:
    needs: [build, rust-host]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta')
    # Same group as tauri, per ref, and never cancelled. The next release on
    # this ref waits until the previous installer build finishes, including
    # the step that points releases/latest at the highest stable version.
    # The group name release-tauri belongs to the called workflow. The tauri
    # job holds this group while that workflow runs, so reusing the name
    # deadlocks.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.released.outputs.tag }}
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Official Node.js 26 binaries do not ship Corepack. 0.36.0 is the
      # Corepack release the Node.js 26 line last tracked.
      - run: npm install -g corepack@0.36.0
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - id: released
        run: |
          if [ -f .released-tag ]; then
            echo "tag=$(cat .released-tag)" >> "$GITHUB_OUTPUT"
          fi

  tauri:
    needs: release
    if: needs.release.outputs.tag != ''
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/release-tauri.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
    permissions:
      contents: write
