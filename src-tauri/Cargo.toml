[package]
name = "ham-radio"
version = "0.42.5"
description = "HamBench desktop app"
authors = ["Bryan Hunt"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"
autobins = false
default-run = "HamBench"

# The macOS Dock tooltip uses this filename while `tauri dev` is running.
[[bin]]
name = "HamBench"
path = "src/main.rs"

[lib]
name = "ham_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-serialplugin = "3.0.7"
tauri-plugin-mcp-bridge = "0.13.0"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-opener = "2.5.5"
tauri-plugin-sql = { version = "2.4.1", features = ["sqlite"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.12.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.11"
zip = { version = "4", default-features = false, features = ["deflate"] }
url = "2"
