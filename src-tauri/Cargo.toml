[package]
name = "ham-radio"
version = "1.0.0"
description = "Ham Radio UI"
authors = ["Bryan Hunt"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ham_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-serialplugin = "2.21.1"
tauri-plugin-mcp-bridge = "0.8.0"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-opener = "2.5.4"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
