[package]
name = "ham-radio"
version = "1.24.3"
description = "HamBench desktop app"
authors = ["Bryan Hunt"]
license = "MIT"
edition = "2021"
rust-version = "1.85.0"
autobins = false
default-run = "HamBench"

# The macOS Dock tooltip uses this filename while `tauri dev` is running.
[[bin]]
name = "HamBench"
path = "src/main.rs"

[lib]
name = "ham_radio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.10.0"
tauri-plugin-serialplugin = "3.0.7"
tauri-plugin-mcp-bridge = "0.13.0"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-opener = "=2.7.0"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio"] }
tauri-plugin-process = "2.4.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-updater = "=2.13.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
url = "2"
tauri-plugin-window-state = "=2.5.0"
