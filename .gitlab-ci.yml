image: node:18-alpine

stages:
  - build
  - publish

cache:
  key: modules
  paths:
    - node_modules/
    - .yarn/cache/
    - dist/

build:
  stage: build
  before_script:
    - apk update && apk add python3 && apk add make && apk add g++ && apk add linux-headers
  script:
    - yarn install
    - yarn lint

publish:
  stage: publish
  only:
    - tags
  script:
    - echo "//registry.npmjs.org/:_authToken=$NPM_AUTH_TOKEN" > ~/.npmrc
    - npm publish --access public
